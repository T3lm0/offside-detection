[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offside-detection"
version = "0.2.0"
description = "Work-in-progress semi-automatic offside analysis from a single broadcast frame"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Telmo Clemente Serrano" }]
requires-python = ">=3.10"
dependencies = [
    "numpy==2.1.3",
    "opencv-python==4.11.0.86",
    "scipy==1.14.1",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics==8.3.34",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
tracking = ["lap"]

[tool.setuptools.packages.find]
where = ["src"]
